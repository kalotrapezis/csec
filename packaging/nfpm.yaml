# nfpm config — builds both .deb (Linux Mint) and .rpm (Fedora KDE) from one file.
#   https://nfpm.goreleaser.com
#
# Build from the repo root after `make`:
#   nfpm pkg -f packaging/nfpm.yaml -p deb -t dist/
#   nfpm pkg -f packaging/nfpm.yaml -p rpm -t dist/
# (or `make deb` / `make rpm` / `make package`)
#
# All `src` paths are relative to the repo root (the directory you run nfpm in).

name: csec
arch: amd64            # nfpm maps amd64 -> x86_64 for the .rpm
platform: linux
version: "0.0.9"
release: "1"
section: net
priority: optional
maintainer: Theologos Kalotrapezis <kalotrapezis@gmail.com>
description: |
  CSec — Classroom Web Filter.
  A filtering HTTP/HTTPS proxy with domain whitelist/blacklist, category block
  lists, and forced Google SafeSearch / YouTube Restricted Mode. Runs as a
  systemd service and is managed from the command line (`csec`).
vendor: Theologos Kalotrapezis
homepage: https://github.com/Theologos-Kalotrapezis/CSec
license: GPL-3.0-or-later

depends:
  - systemd
recommends:
  - nftables             # transparent enforcement mode
  - glib2                # Fedora: provides `gsettings` (overridden for deb below)

contents:
  - src: ./csec
    dst: /usr/bin/csec
    file_info:
      mode: 0755

  - src: ./packaging/csec.service
    dst: /usr/lib/systemd/system/csec.service
    file_info:
      mode: 0644

  - src: ./Lists/*.txt
    dst: /usr/share/csec/lists/
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/postinstall.sh
  preremove:   ./packaging/preremove.sh
  postremove:  ./packaging/postremove.sh

overrides:
  deb:
    depends:
      - libc6
      - systemd
    recommends:
      - nftables         # transparent enforcement mode
      - libglib2.0-bin   # Debian/Mint: provides `gsettings`
      - kde-cli-tools    # provides `kwriteconfig5/6` for KDE
  rpm:
    depends:
      - glibc
      - systemd
    recommends:
      - nftables         # transparent enforcement mode
      - glib2            # Fedora: provides `gsettings` (KDE config tools ship with the desktop)
